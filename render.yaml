# Render.com blueprint for the ALTERNATIVE single-host deploy (see README
# "Alternative: single always-on host with a real disk"). Builds the root
# Dockerfile, which bundles the client build + server into one process/URL.
#
# Needs the Starter plan (~$7/mo) — Render's free web services can't attach
# a persistent disk at all, so SQLite has nowhere durable to live there.
#
# Deploy: render.com → New → Blueprint → point at this repo.
services:
  - type: web
    name: five-day-split-tracker
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DATA_DIR
        value: /data
      - key: PORT
        value: 4000
    disk:
      name: tracker-data
      mountPath: /data
      sizeGB: 1
